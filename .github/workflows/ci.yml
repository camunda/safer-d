name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: dub test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0
      # Plain dub and bash rather than make, so Windows runs the same steps.
      - run: dub test -q
        shell: bash
      - run: dub test -q :check
        shell: bash
      - name: safer-d checks itself
        shell: bash
        run: dub build -q :check && ./safer-d-check --root .
      - name: init scaffolds a project that builds, tests and gates
        shell: bash
        run: scripts/e2e.sh

  lint:
    name: D-Scanner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0
      - run: dub run -q dscanner@0.16.0-beta.5 -- --styleCheck --config dscanner.ini source check/source
